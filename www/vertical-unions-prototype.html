<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>European Monarchies Timeline — Vertical Unions Prototype</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;background:#f8fafc;color:#0f172a}
    .wrap{padding:24px;max-width:1400px;margin:0 auto}
    h1{margin:0 0 8px;font-size:28px}
    p.lead{margin:0 0 18px;color:#475569;max-width:980px}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;box-shadow:0 6px 24px rgba(15,23,42,.06);overflow:auto}
    svg{display:block}
    .axis path,.axis line{stroke:#cbd5e1}
    .axis text{fill:#475569;font-size:12px}
    .column-label{font-size:13px;font-weight:700;fill:#0f172a}
    .column-sub{font-size:11px;fill:#64748b}
    .house-label{font-size:11px;font-weight:600;fill:#fff;pointer-events:none}
    .union-label{font-size:12px;font-weight:700;fill:#fff;pointer-events:none}
    .monarch-label{font-size:10px;fill:#0f172a}
    .tooltip{position:fixed;pointer-events:none;background:rgba(15,23,42,.96);color:#fff;padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.35;display:none;max-width:260px;box-shadow:0 10px 25px rgba(0,0,0,.25)}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Vertical prototype: realms + unions</h1>
    <p class="lead">Time runs top to bottom. Each realm gets a column. Dynastic family lines are painted inside each realm column, and unions can span multiple realm columns to show crowns that cover more than one country.</p>
    <div class="card">
      <svg id="chart" width="1240" height="1700"></svg>
    </div>
  </div>
  <div class="tooltip" id="tooltip"></div>

  <script>
    const monarchies = [
      { id:'kingdom-england', name:'England', region:'Britain', start_year:927, end_year:1707 },
      { id:'kingdom-scotland', name:'Scotland', region:'Britain', start_year:843, end_year:1707 },
      { id:'kingdom-france', name:'France', region:'Western Europe', start_year:843, end_year:1792 },
      { id:'holy-roman-empire', name:'Holy Roman Empire', region:'Central Europe', start_year:800, end_year:1806 },
      { id:'kingdom-denmark', name:'Denmark', region:'Nordics', start_year:958, end_year:1814 },
      { id:'kingdom-norway', name:'Norway', region:'Nordics', start_year:872, end_year:1814 },
      { id:'kingdom-sweden', name:'Sweden', region:'Nordics', start_year:970, end_year:1809 }
    ];

    const houses = [
      { id:'england-plantagenet', monarchy_id:'kingdom-england', name:'Plantagenet', start_year:1154, end_year:1485, color:'#16a34a' },
      { id:'england-tudor', monarchy_id:'kingdom-england', name:'Tudor', start_year:1485, end_year:1603, color:'#4ade80' },
      { id:'england-stuart', monarchy_id:'kingdom-england', name:'Stuart', start_year:1603, end_year:1707, color:'#86efac' },
      { id:'scotland-stuart', monarchy_id:'kingdom-scotland', name:'Stuart', start_year:1371, end_year:1707, color:'#22c55e' },
      { id:'france-valois', monarchy_id:'kingdom-france', name:'Valois', start_year:1328, end_year:1589, color:'#2563eb' },
      { id:'france-bourbon', monarchy_id:'kingdom-france', name:'Bourbon', start_year:1589, end_year:1792, color:'#60a5fa' },
      { id:'hre-habsburg', monarchy_id:'holy-roman-empire', name:'Habsburg', start_year:1438, end_year:1806, color:'#a78bfa' },
      { id:'denmark-oldenburg', monarchy_id:'kingdom-denmark', name:'Oldenburg', start_year:1448, end_year:1863, color:'#f59e0b' },
      { id:'norway-oldenburg', monarchy_id:'kingdom-norway', name:'Oldenburg', start_year:1450, end_year:1814, color:'#fbbf24' },
      { id:'sweden-vasa', monarchy_id:'kingdom-sweden', name:'Vasa', start_year:1523, end_year:1654, color:'#fb923c' }
    ];

    const monarchs = [
      { id:'elizabeth-i', monarchy_id:'kingdom-england', house_id:'england-tudor', name:'Elizabeth I', reign_start:1558, reign_end:1603, label:true },
      { id:'james-vi-i-scotland', monarchy_id:'kingdom-scotland', house_id:'scotland-stuart', name:'James VI', reign_start:1567, reign_end:1625, label:true },
      { id:'james-vi-i-england', monarchy_id:'kingdom-england', house_id:'england-stuart', name:'James I', reign_start:1603, reign_end:1625, label:true },
      { id:'louis-xiv', monarchy_id:'kingdom-france', house_id:'france-bourbon', name:'Louis XIV', reign_start:1643, reign_end:1715, label:true },
      { id:'charles-v', monarchy_id:'holy-roman-empire', house_id:'hre-habsburg', name:'Charles V', reign_start:1519, reign_end:1556, label:true },
      { id:'christian-i', monarchy_id:'kingdom-denmark', house_id:'denmark-oldenburg', name:'Christian I', reign_start:1448, reign_end:1481, label:false },
      { id:'gustav-vasa', monarchy_id:'kingdom-sweden', house_id:'sweden-vasa', name:'Gustav Vasa', reign_start:1523, reign_end:1560, label:true }
    ];

    Promise.all([
      d3.json('../data/sample_unions.json')
    ]).then(([unions]) => {
      const svg = d3.select('#chart');
      const width = +svg.attr('width');
      const height = +svg.attr('height');
      const margin = { top: 80, right: 30, bottom: 30, left: 90 };
      const topLabelSpace = 60;
      const yearMin = 800;
      const yearMax = 1814;
      const y = d3.scaleLinear().domain([yearMin, yearMax]).range([margin.top + topLabelSpace, height - margin.bottom]);
      const x = d3.scalePoint().domain(monarchies.map(d => d.id)).range([margin.left + 70, width - margin.right - 70]).padding(0.6);
      const columnWidth = 92;
      const tooltip = d3.select('#tooltip');

      const formatYear = (year) => year < 0 ? `${Math.abs(year)} BC` : `${year}`;
      const moveTip = (event) => tooltip.style('left', (event.clientX + 14) + 'px').style('top', (event.clientY + 14) + 'px');
      const showTip = (event, html) => { tooltip.style('display', 'block').html(html); moveTip(event); };
      const hideTip = () => tooltip.style('display', 'none');

      svg.append('g')
        .attr('class', 'axis')
        .attr('transform', `translate(${margin.left - 18},0)`)
        .call(d3.axisLeft(y).tickValues([800, 1000, 1200, 1400, 1600, 1800]).tickFormat(formatYear));

      monarchies.forEach(monarchy => {
        const cx = x(monarchy.id);
        svg.append('text').attr('class', 'column-label').attr('x', cx).attr('y', margin.top).attr('text-anchor', 'middle').text(monarchy.name);
        svg.append('text').attr('class', 'column-sub').attr('x', cx).attr('y', margin.top + 16).attr('text-anchor', 'middle').text(monarchy.region);

        svg.append('rect')
          .attr('x', cx - columnWidth / 2)
          .attr('y', y(monarchy.start_year))
          .attr('width', columnWidth)
          .attr('height', Math.max(8, y(monarchy.end_year) - y(monarchy.start_year)))
          .attr('rx', 16)
          .attr('fill', '#f8fafc')
          .attr('stroke', '#cbd5e1');
      });

      houses.forEach(house => {
        const cx = x(house.monarchy_id);
        const y1 = y(house.start_year);
        const y2 = y(house.end_year);
        svg.append('rect')
          .attr('x', cx - 32)
          .attr('y', y1)
          .attr('width', 64)
          .attr('height', Math.max(10, y2 - y1))
          .attr('rx', 12)
          .attr('fill', house.color)
          .attr('stroke', 'rgba(15,23,42,.18)')
          .on('mousemove', moveTip)
          .on('mouseover', (event) => showTip(event, `<strong>${house.name}</strong><br>${formatYear(house.start_year)} → ${formatYear(house.end_year)}`))
          .on('mouseout', hideTip);

        if ((y2 - y1) > 46) {
          svg.append('text')
            .attr('class', 'house-label')
            .attr('x', cx)
            .attr('y', y1 + 18)
            .attr('text-anchor', 'middle')
            .text(house.name);
        }
      });

      unions.forEach(union => {
        const columns = union.monarchy_ids.map(id => x(id)).filter(Boolean).sort((a,b) => a - b);
        if (!columns.length) return;
        const left = columns[0] - 48;
        const right = columns[columns.length - 1] + 48;
        const top = y(union.start_year);
        const bottom = y(union.end_year);

        svg.append('rect')
          .attr('x', left)
          .attr('y', top)
          .attr('width', right - left)
          .attr('height', Math.max(12, bottom - top))
          .attr('rx', 18)
          .attr('fill', union.color)
          .attr('opacity', 0.22)
          .attr('stroke', union.color)
          .attr('stroke-width', 2)
          .attr('stroke-dasharray', '7 6')
          .on('mousemove', moveTip)
          .on('mouseover', (event) => showTip(event, `<strong>${union.name}</strong><br>${union.type}<br>${formatYear(union.start_year)} → ${formatYear(union.end_year)}`))
          .on('mouseout', hideTip);

        svg.append('text')
          .attr('class', 'union-label')
          .attr('x', (left + right) / 2)
          .attr('y', top + 18)
          .attr('text-anchor', 'middle')
          .text(union.name);
      });

      monarchs.forEach(monarch => {
        const cx = x(monarch.monarchy_id);
        const cy = y((monarch.reign_start + monarch.reign_end) / 2);
        const house = houses.find(h => h.id === monarch.house_id);
        svg.append('circle')
          .attr('cx', cx)
          .attr('cy', cy)
          .attr('r', 6)
          .attr('fill', house ? house.color : '#334155')
          .attr('stroke', '#fff')
          .attr('stroke-width', 2)
          .on('mousemove', moveTip)
          .on('mouseover', (event) => showTip(event, `<strong>${monarch.name}</strong><br>${formatYear(monarch.reign_start)} → ${formatYear(monarch.reign_end)}`))
          .on('mouseout', hideTip);

        if (monarch.label) {
          svg.append('text')
            .attr('class', 'monarch-label')
            .attr('x', cx + 8)
            .attr('y', cy + 4)
            .text(monarch.name);
        }
      });
    });
  </script>
</body>
</html>
